<!doctype html>
<html lang="vi">
<head>

  <meta name="description" content="Học từ vựng tiếng Trung theo chuẩn HSK 3.0 với FSRS-4.5, 15 dạng bài Active Recall và gợi ý ghi nhớ theo bộ thủ.">
  <meta name="theme-color" content="#0D0F14">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="src/assets/icons/icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="src/css/components.css">

<body>
  <a class="skip-link" href="#app">Bỏ qua điều hướng</a>

  <header class="topbar" role="banner">

    </nav>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
